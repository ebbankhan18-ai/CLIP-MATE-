[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-mate"
version = "0.1.0"
description = "Turn one long video into vertical clips with captions, then publish them."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["backend"]

# The ASGI application object the deployment platform loads.
[tool.vercel]
entrypoint = "backend.main:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
